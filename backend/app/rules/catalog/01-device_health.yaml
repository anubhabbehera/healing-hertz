# Device reachability, state, resource pressure and firmware.
#
# Each entry is one diagnostic check. `kind: python` means the predicate still
# lives in app/rules/device_health.py; the catalog owns the rule's identity and metadata.
# Entry order here is evaluation order, which is user-visible: findings are sorted
# by severity with a stable sort, so within a severity band they appear in the
# order their rules ran.

rules:
  - id: device.offline
    kind: python
    impl: app.rules.device_health:OfflineDevice
    category: device_health

  - id: device.degraded_state
    kind: python
    impl: app.rules.device_health:DegradedState
    category: device_health

  - id: device.pending_adoption
    kind: python
    impl: app.rules.device_health:PendingAdoption
    category: device_health

  - id: device.unsupported
    kind: python
    impl: app.rules.device_health:UnsupportedDevice
    category: device_health

  - id: device.high_cpu
    kind: python
    impl: app.rules.device_health:HighCpu
    category: device_health

  - id: device.high_memory
    kind: python
    impl: app.rules.device_health:HighMemory
    category: device_health

  - id: device.high_load
    kind: python
    impl: app.rules.device_health:HighLoad
    category: device_health

  - id: device.recent_reboot
    kind: python
    impl: app.rules.device_health:RecentReboot
    category: device_health

  - id: device.reboot_loop
    kind: python
    impl: app.rules.device_health:RebootLoop
    category: device_health

  - id: device.stale_uptime
    kind: python
    impl: app.rules.device_health:StaleUptime
    category: device_health

  - id: firmware.update_available
    kind: python
    impl: app.rules.device_health:FirmwareUpdateAvailable
    category: firmware

  - id: firmware.version_drift
    kind: python
    impl: app.rules.device_health:MixedApFirmware
    category: firmware
