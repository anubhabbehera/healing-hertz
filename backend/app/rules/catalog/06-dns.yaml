# DNS resolution volume and filtering behaviour.
#
# Each entry is one diagnostic check. `kind: python` means the predicate still
# lives in app/rules/dns.py; the catalog owns the rule's identity and metadata.
# Entry order here is evaluation order, which is user-visible: findings are sorted
# by severity with a stable sort, so within a severity band they appear in the
# order their rules ran.

rules:
  - id: dns.security_blocks
    kind: python
    impl: app.rules.dns:DnsSecurityBlocks
    category: clients

  - id: dns.anomalies
    kind: python
    impl: app.rules.dns:DnsBlockedSpike
    category: clients
