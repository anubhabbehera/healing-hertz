name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job's name is what branch protection requires — keep it stable.
  test:
    name: lint & test
    runs-on: ubuntu-latest
    # Job-level so the upload step can test for it in `if:`; a step cannot read
    # an env var it defines itself.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to
      # point at new code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from lockfiles)
        run: make setup

      - name: Lint (ruff + tsc)
        run: make lint

      # The rule catalog is data, so a bad edit is not a syntax error anywhere.
      # Checking it loads catches a malformed entry here rather than at the
      # first scan, where a silently-reduced rule set would report a network as
      # healthier than it is.
      - name: Validate rule catalog
        run: make validate-rules

      - name: Test
        run: make coverage

      # Coverage reporting must never be the reason a green build looks red:
      # the upload is best-effort and skipped entirely when no token is set.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Build frontend
        run: make build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from lockfiles)
        run: make setup

      # Deliberately not a required check: a new upstream advisory should raise
      # a visible signal, not block an unrelated PR from merging.
      - name: Scan dependencies for known CVEs
        run: make audit
