name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job's name is what branch protection requires — keep it stable.
  test:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to
      # point at new code, a SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from lockfiles)
        run: make setup

      - name: Lint (ruff + tsc)
        run: make lint

      - name: Test
        run: make test

      - name: Build frontend
        run: make build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from lockfiles)
        run: make setup

      # Deliberately not a required check: a new upstream advisory should raise
      # a visible signal, not block an unrelated PR from merging.
      - name: Scan dependencies for known CVEs
        run: make audit
