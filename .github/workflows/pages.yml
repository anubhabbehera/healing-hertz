name: Pages

# The wiki renders the repository's own markdown, so it has to rebuild when
# that markdown changes — not only when the site's own source does. The last
# path matters for the same reason: the site imports the app's stylesheet, so a
# theme change there is a content change here.
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'site/**'
      - 'frontend/src/styles.css'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Never cancel a half-finished deploy: the replacement would start from the
# same commit anyway, and an interrupted one can leave the site partly written.
concurrency:
  group: pages
  cancel-in-progress: false

# Read-only by default. The two writes deploy-pages needs are granted on that
# job alone, so the build — which is what actually runs third-party code —
# never holds them.
permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    env:
      # Astro phones home with anonymous usage data unless told otherwise.
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to
      # point at new code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies (from lockfile)
        run: npm ci
        working-directory: site

      # `npm run build` syncs the markdown out of the repository root first, so
      # this step is also what proves scripts/sync-docs.mjs still resolves every
      # source file it expects.
      - name: Build
        run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publish the artifact
      id-token: write   # OIDC token deploy-pages exchanges for that permission
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
